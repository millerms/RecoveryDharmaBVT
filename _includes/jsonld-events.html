{%- if site.data.meditation-events and site.data.meditation-events.size > 0 -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
  {%- for e in site.data.meditation-events -%}
    {%- capture event_start -%}{{ e.date }}{% if e.start_time %}T{{ e.start_time }}:00-04:00{% endif %}{%- endcapture -%}
    {%- if e.end_date or e.end_time -%}
      {%- capture event_end -%}{{ e.end_date | default: e.date }}{% if e.end_time %}T{{ e.end_time }}:00-04:00{% endif %}{%- endcapture -%}
    {%- endif -%}
    {
      "@type": "Event",
      "name": {{ e.title | jsonify }},
      "startDate": {{ event_start | jsonify }},
      {%- if e.end_date or e.end_time %}
      "endDate": {{ event_end | jsonify }},
      {%- endif %}
      "description": {{ e.description | jsonify }},
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": {{ e.venue | default: e.location | jsonify }},
        "address": {
          "@type": "PostalAddress",
          "streetAddress": {{ e.location | jsonify }},
          "addressRegion": "VT",
          "addressCountry": "US"
        }
      },
      "organizer": {
        "@type": "Organization",
        "name": {{ site.social.name | default: site.title | jsonify }},
        "url": {{ site.url | append: site.baseurl | jsonify }}
      }{% if e.url %},
      "url": {{ e.url | jsonify }}{% endif %}
    }{%- unless forloop.last -%},{%- endunless -%}
  {%- endfor -%}
  ]
}
</script>
{%- endif -%}
