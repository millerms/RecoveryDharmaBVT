- title: "Awakening the Heart: The Transformative Practice of Lovingkindness"
  date: "2026-11-21"
  start_time: "12:30"
  end_time: "16:30"
  time: "12:30 PM-4:30 PM"
  who: "Miv London"
  location: "The Chance Mill"
  cost: "Registration Fee: $45-$65"
  url: "https://laughingriveryoga.union.site/events/laughing-river-yoga-awakening-the-heart-the-transformative-practice-of-lovingkindness"
  description: >-
    The practice of Lovingkindness (Metta) is more than a meditation - it is a way to heal and transform ourselves and our relationship to the world. At a time of widespread division, stress, and uncertainty, this practice helps soften our hearts, reduce stress, and create a ripple effect of kindness that can inspire and uplift others.
    <br><br>
    Whether you are new to meditation or an experienced practitioner, this half-day retreat will provide you with an opportunity to pause, reflect, and reconnect with what truly matters. The afternoon will include guided and silent sitting and walking meditation, with plenty of instructions and support.