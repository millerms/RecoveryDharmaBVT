- title: "Medicine Buddha Practice"
  date: "2026-08-26"
  start_time: "19:00"
  end_time: "20:30"
  time: "7:00-8:30 PM"
  recurrence: "Every fourth Wednesday of the month"
  venue: "Choir Room"
  location: "21 Buell Street, Burlington, VT"
  url: "https://www.burlingtondharmacollective.com/medicine-buddha"
  description: >-
    In this practice, we invoke and connect to the healing power of Medicine
    Buddha to alleviate suffering of all kinds - personal, transpersonal, and
    collective. We experience becoming the medicine, which is to remember that
    phenomenal reality is always pointing toward liberation - the ultimate
    healing.

