- title: "An Evening with Lama Rod Owens"
  date: "2026-10-14"
  venue: "The O.N.E. Community Center"
  location: "20 Allen St, Burlington, VT"
  url: "https://docs.google.com/forms/d/e/1FAIpQLSfaRCZBx3yMrAZGUalljvvw9lHWHYWdX4AutW0P9PLsO9Q6Cw/viewform?pli=1"
  description: >-
    We're delighted to welcome Lama Rod Owens back to Burlington for an evening
    of talk and discussion. An international voice in contemporary Dharma and a
    self-described Black Buddhist Southern Queen, Lama Rod's work bridges
    identity, social change, and deep spiritual practice. His teachings center
    on freedom, self-expression, and radical self-care. We'd love to have you
    join us.

