sections:
  - id: "start-here"
    title: "Start Here"
    description: "The most useful places to begin or reconnect with Recovery Dharma practice."
    resources:
      - type: "Local Meetings"
        title: "Recovery Dharma Vermont Meetings"
        description: "Find in-person Recovery Dharma meetings throughout Vermont."
        url: "https://recoverydharma.org/meetings/?region=vermont"
        action: "Find Vermont meetings"

      - type: "Online Meetings"
        title: "Recovery Dharma Online Meetings"
        description: "Join a virtual Recovery Dharma meeting from wherever you are."
        url: "https://recoverydharma.org/meetings/?search=online"
        action: "Browse online meetings"

      - type: "RD Book"
        title: "The Recovery Dharma Book"
        description: "Read or download the official Recovery Dharma book as a free PDF."
        url: "https://drive.google.com/file/d/1Isotp-WlUedFJlKDqjpvO7uKgVsvX3J1/view"
        action: "Read the book"

      - type: "Meditations"
        title: "Guided Recovery Dharma Meditations"
        description: "Listen to guided meditations commonly used in Recovery Dharma meetings."
        url: "https://recoverydharma.org/resources/meditations/"
        action: "Listen to meditations"

  - id: "recovery-dharma-online"
    title: "Recovery Dharma Online"
    description: "Official information, community spaces, teachings, and support for starting a group."
    resources:
      - type: "RD Global"
        title: "Recovery Dharma Website"
        description: "Visit the official organization website and explore its complete resource library."
        url: "https://recoverydharma.org"
        action: "Visit the website"

      - type: "Videos"
        title: "Recovery Dharma on YouTube"
        description: "Watch Dharma talks, guided meditations, and community recordings."
        url: "https://www.youtube.com/@recoverydharma"
        action: "Watch on YouTube"

      - type: "Online community"
        title: "Recovery Dharma Facebook Group"
        description: "Connect with the wider Recovery Dharma community through its discussion group."
        url: "https://www.facebook.com/groups/recoverydharma"
        action: "Visit the group"

      - type: "Organize"
        title: "Start a Recovery Dharma Group"
        description: "Find guidance and materials for starting a local sangha or meeting."
        url: "https://recoverydharma.org/get-started/sangha-groups/"
        action: "Learn how to start"

  - id: "local-communities"
    title: "Local Meditation Communities"
    description: "Burlington-area communities representing several Buddhist traditions and approaches to meditation."
    resources:
      - type: "Local sangha"
        title: "Burlington Dharma Collective"
        description: "A peer-led Burlington meditation community rooted in contemporary Vajrayana practice."
        url: "https://www.burlingtondharmacollective.com/"
        action: "Visit the collective"
        related:
          - title: "Bhumisparsha"
            url: "https://www.bhumisparsha.org/"
          - title: "Lama Rod Owens"
            url: "https://www.lamarod.com/"

      - type: "Mindfulness community"
        title: "New Leaf Sangha"
        description: "A weekly mindfulness meditation group practicing in the tradition of Thich Nhat Hanh."
        url: "https://www.sevendaysvt.com/event/new-leaf-sangha-mindfulness-practice-41783747"
        action: "View meeting details"
        related:
          - title: "Plum Village"
            url: "https://plumvillage.org/"

      - type: "Meditation center"
        title: "Burlington Shambhala Center"
        description: "Meditation instruction and community practice in the Shambhala tradition."
        url: "https://burlington.shambhala.org/"
        action: "Visit the center"

      - type: "Local community"
        title: "Burlington Buddhist Sangha"
        description: "A local Buddhist meditation group that welcomes new and experienced practitioners."
        url: "https://burlingtonbuddhist.org/where/"
        action: "Visit the sangha"

      - type: "Meditation center"
        title: "Kadampa Meditation Center — Burlington"
        description: "Modern Buddhist meditation classes and events in the Burlington area."
        url: "https://www.kadampanewyork.org/burlington-meditation-class"
        action: "Explore classes"

      - type: "Zen center"
        title: "Vermont Zen Center"
        description: "Zen meditation, retreats, and community practice in Shelburne, Vermont."
        url: "https://www.vermontzen.org/"
        action: "Visit the center"
